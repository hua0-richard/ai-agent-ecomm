services:
  api:
    build:
      context: ./be
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./be/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ecomm
      - WHISPER_URL=http://whisper:9000
      - CLIP_SERVICE_URL=http://clip-service:8001
      - OLLAMA_URL=http://host.docker.internal:11434
      - APP_ENV=development
      - LOG_LEVEL=debug
    depends_on:
      db:
        condition: service_healthy
      whisper:
        condition: service_healthy
      clip-service:
        condition: service_healthy
    volumes:
      - ./be:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: sync
          path: ./be
          target: /app

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./fe/src:/app/src
      - ./fe/public:/app/public
      - ./fe/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api

  clip-service:
    build:
      context: ./clip-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - CLIP_MODEL_NAME=wkcn/TinyCLIP-ViT-61M-32-Text-29M-LAION400M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./clip-service:/app
      - clip_models:/root/.cache/huggingface
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=tiny.en
      - ASR_ENGINE=openai_whisper
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/docs > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - whisper_models:/root/.cache/whisper

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecomm
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
  whisper_models:
  clip_models:
