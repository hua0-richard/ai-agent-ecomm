services:
  api:
    build:
      context: ./be
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./be/.env
    environment:
      - CLIP_SERVICE_URL=http://clip-service:8001
    depends_on:
      clip-service:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  clip-service:
    build:
      context: ./clip-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - CLIP_MODEL_NAME=wkcn/TinyCLIP-ViT-61M-32-Text-19M-v2
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - clip_models:/root/.cache/huggingface

volumes:
  clip_models:
