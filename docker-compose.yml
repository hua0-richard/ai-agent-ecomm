services:
  api:
    build:
      context: ./be
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./be/.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ecomm
      - CLIP_SERVICE_URL=http://clip-service:8001
    depends_on:
      db:
        condition: service_healthy
      clip-service:
        condition: service_healthy
    volumes:
      - ./be:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  clip-service:
    build:
      context: ./clip-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - CLIP_MODEL_NAME=wkcn/TinyCLIP-ViT-61M-32-Text-19M-v2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - clip_models:/root/.cache/huggingface

db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecomm
    volumes:
      - ./be:/app
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  clip_models:
